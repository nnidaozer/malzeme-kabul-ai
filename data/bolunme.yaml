# Standartların geliştirme / test kümesine bölünmesi (docs/mimari.md madde 7).
#
# Geliştirme kümesi: istemler, kurallar ve çıkarıcılar bu standartlara
# bakılarak geliştirilir. MIL-PRF-23377, 81733D ve 85285E'ye zaten bakıldı;
# görülmemiş sayılmazlar.
#
# MIL-S-81733C ve MIL-PRF-85285F de geliştirmededir: aileleri (81733, 85285)
# D ve E revizyonlarıyla zaten görüldü (Nida'nın kararı, 24 Kasım 2026).
#
# Test kümesi: yeni indirilen standartların (yeni_standartlar) revizyon
# ailelerinin rastgele yarısı, bütün revizyonlarıyla birlikte, `tohum` ile
# seçilir (python deney/bolunme.py --sec). Seçim yapılana kadar
# test_durumu "bekliyor"dur ve yeni standartların hiçbirine bakılmaz.
# Test kümesindeki standartlarda çıkarıcı çalıştırılmaz, taslak cevap
# hazırlanmaz; deney ve çıkarıcı betikleri bunları reddeder. Kilidi
# (test_kumesi_acik) dil modeli çıkarıcısı dondurulunca yalnız proje sahibi açar.
#
# kilitli_klasorler: data/raw altında bu adlı klasörlerdeki belgeler (gerçek
# havacılık CoC'si ve test raporu) doğrudan test kümesindedir ve aynı kilitle
# açılmaz. Sistemin gerçek bir havacılık belgesindeki ilk sınavı olacaklar.
#
# Biçim bilerek basit tutuldu (yorum, "anahtar: değer" ve "- öğe" listeleri);
# deney/bolunme.py bu alt kümeyi okur.

test_kumesi_acik: false
test_durumu: secildi
tohum: 20261209

