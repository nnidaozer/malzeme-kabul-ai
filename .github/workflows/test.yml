name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tesseract kur (yerel OCR, docs/ocr.md)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Bağımlılıkları kur (sabit sürümler)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Testleri çalıştır
        run: pytest

  arayuz:
    # Streamlit ekranlarının testleri; arayüz kilidi geliştirme kilidinin üstüne streamlit ekler.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tesseract kur (yerel OCR, docs/ocr.md)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Bağımlılıkları kur (arayüz kilidi)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-arayuz.lock
          pip install -e . --no-deps
      - name: Testleri çalıştır (streamlit ile)
        run: pytest

  ag-testi:
    # Docker imajını kurar, docker compose ile kaldırır ve uygulamanın ağsız çalıştığını gösterir.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ağsız Docker testi
        env:
          AG_TESTI_KAPAT: "1"
          AG_TESTI_KONTROL: "1"
        # Varsayılan parola yok: compose parolaları secrets olarak ister. Her koşuda
        # rastgele üretilir, maskelenir ve loga yazılmaz.
        run: |
          MALZEME_KABUL_MP_PAROLASI="$(openssl rand -hex 16)"
          MALZEME_KABUL_GK_PAROLASI="$(openssl rand -hex 16)"
          echo "::add-mask::$MALZEME_KABUL_MP_PAROLASI"
          echo "::add-mask::$MALZEME_KABUL_GK_PAROLASI"
          export MALZEME_KABUL_MP_PAROLASI MALZEME_KABUL_GK_PAROLASI
          sh scripts/ag_testi.sh

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit kur
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1
      - name: Bilinen açıkları tara
        # Bilinen açığı olan bir sürüm ya da taranamayan bir paket CI'ı kırmızıya çevirir.
        run: |
          pip-audit --strict --desc -r requirements-dev.lock
          pip-audit --strict --desc -r requirements-arayuz.lock
