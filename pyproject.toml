[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "malzeme-kabul"
version = "0.1.0"
description = "MIL-PRF-23377 standardı ile tedarikçi sertifikasını karşılaştıran belge kontrol sistemi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11", "pydantic>=2", "pint>=0.23", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest", "reportlab", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "dil_modeli: yerel dil modeli gerektirir; yalnız --dil-modeli MODEL verilince çalışır",
]
